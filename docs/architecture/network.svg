<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img"><title>Network design / 网络设计</title><desc>Deployment relationships, not a device inventory • 保留设计关系，不表示实际设备清单或当前在线状态</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#17253d}.title{font-size:29px;font-weight:700}.subtitle{font-size:17px;fill:#52647d}.node{font-size:20px;font-weight:700}.cn{font-size:17px;fill:#3b506b}.detail{font-size:15px;fill:#52647d}.edge{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}.label{font-size:15px;fill:#40556e}.boundary{fill:#f8fafc;stroke:#bdcadd;stroke-width:1.5;stroke-dasharray:8 5}</style>
<rect width="1440" height="940" fill="white"/>
<text x="45" y="53" class="title">Network design / 网络设计</text>
<text x="45" y="85" class="subtitle">Deployment relationships, not a device inventory • 保留设计关系，不表示实际设备清单或当前在线状态</text>
<rect x="460" y="300" width="520" height="395" rx="20" class="boundary"/><text x="485" y="333" class="node">Linux host / Linux 宿主</text>
<path d="M385 215 H555" class="edge"/>
<text x="393" y="192" class="label">overlay / 私网</text>
<path d="M720 265 V355" class="edge"/>
<text x="735" y="290" class="label">API endpoint / API 目标</text>
<path d="M330 438 H490" class="edge"/>
<text x="347" y="417" class="label">LAN / 局域网</text>
<path d="M930 265 H1015 V570 H950" class="edge"/>
<text x="1030" y="350" class="label">policy-selected internet</text>
<path d="M950 589 H1045 V470 H1080" class="edge"/>
<text x="1080" y="560" class="label">primary / 主用</text>
<path d="M950 625 H1045 V740 H1080" class="edge"/>
<text x="1080" y="660" class="label">fallback / 备用</text>
<path d="M1230 530 V680" class="edge dash"/>
<text x="1242" y="610" class="label">failover / 主备策略</text>
<rect x="65" y="145" width="320" height="120" rx="15" fill="#eef5ff" stroke="#a8c3e8"/>
<text x="83" y="176" class="node">Off-site Mac / Android</text>
<text x="83" y="203" class="cn">外出 Mac / 安卓</text>
<text x="83" y="230" class="detail">Current uplink + own identity</text>
<rect x="555" y="145" width="395" height="120" rx="15" fill="#eef5ff" stroke="#a8c3e8"/>
<text x="573" y="176" class="node">Shared private overlay</text>
<text x="573" y="203" class="cn">统一私网互联</text>
<text x="573" y="230" class="detail">Direct first; relay when required</text>
<rect x="65" y="380" width="265" height="145" rx="15" fill="#eef5ff" stroke="#a8c3e8"/>
<text x="83" y="411" class="node">LAN clients + switch</text>
<text x="83" y="438" class="cn">本地客户端与交换/AP</text>
<text x="83" y="465" class="detail">Mac / Android / Windows</text>
<text x="83" y="492" class="detail">Existing LAN; no app tunnel</text>
<rect x="490" y="355" width="460" height="140" rx="15" fill="#eef5ff" stroke="#a8c3e8"/>
<text x="508" y="386" class="node">Workbench API + collectors</text>
<text x="508" y="413" class="cn">工作台 API 与采集器</text>
<text x="508" y="440" class="detail">Application data path / 业务数据链路</text>
<text x="508" y="467" class="detail">API authentication remains required</text>
<rect x="490" y="545" width="460" height="125" rx="15" fill="#fff8ef" stroke="#d9b985"/>
<text x="508" y="576" class="node">Virtual gateway guest</text>
<text x="508" y="603" class="cn">虚拟网关来宾系统</text>
<text x="508" y="630" class="detail">OpenWrt + policy/proxy core</text>
<text x="508" y="657" class="detail">Isolated WAN and management paths</text>
<rect x="1080" y="405" width="310" height="125" rx="15" fill="#fff8ef" stroke="#d9b985"/>
<text x="1098" y="436" class="node">Primary egress</text>
<text x="1098" y="463" class="cn">主用出口</text>
<text x="1098" y="490" class="detail">External network dependency</text>
<text x="1098" y="517" class="detail">Not configured by Workbench</text>
<rect x="1080" y="680" width="310" height="125" rx="15" fill="#fff8ef" stroke="#d9b985"/>
<text x="1098" y="711" class="node">Standby egress</text>
<text x="1098" y="738" class="cn">备用出口</text>
<text x="1098" y="765" class="detail">Selected by gateway policy</text>
<text x="1098" y="792" class="detail">No client-side VPS list</text>
<rect x="65" y="750" width="850" height="150" rx="15" fill="#eef5ff" stroke="#a8c3e8"/>
<text x="83" y="781" class="node">Two paths, separate responsibilities</text>
<text x="83" y="808" class="cn">业务访问与上网出口分离</text>
<text x="83" y="835" class="detail">API / SSH / files → target private endpoint; not all routed through the gateway.</text>
<text x="83" y="862" class="detail">业务按目标私网访问；规则选中的海外上网经认证私网代理 → 网关 → 主备出口。</text>
<text x="83" y="889" class="detail">Domestic/local traffic follows policy; Workbench only observes network evidence.</text>
</svg>