<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img"><title>Workbench system / 工作台系统</title><desc>Logical roles and data flow • 逻辑职责与数据流；角色名称均为通用示意</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#17253d}.title{font-size:29px;font-weight:700}.subtitle{font-size:17px;fill:#52647d}.node{font-size:20px;font-weight:700}.cn{font-size:17px;fill:#3b506b}.detail{font-size:15px;fill:#52647d}.edge{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}.label{font-size:15px;fill:#40556e}.boundary{fill:#f8fafc;stroke:#bdcadd;stroke-width:1.5;stroke-dasharray:8 5}</style>
<rect width="1440" height="940" fill="white"/>
<text x="45" y="53" class="title">Workbench system / 工作台系统</text>
<text x="45" y="85" class="subtitle">Logical roles and data flow • 逻辑职责与数据流；角色名称均为通用示意</text>
<rect x="35" y="125" width="1370" height="525" rx="20" class="boundary"/>
<text x="55" y="155" class="label">PUBLIC COMPONENTS / 已公开组件</text>
<path d="M385 265 H545" class="edge"/>
<text x="390" y="241" class="label">snapshot / metrics →</text>
<path d="M545 303 H385" class="edge"/>
<text x="390" y="327" class="label">← shared JSON</text>
<path d="M895 265 H1060" class="edge"/>
<text x="916" y="241" class="label">JSON reads →</text>
<path d="M1060 303 H895" class="edge"/>
<text x="911" y="327" class="label">← phone metrics</text>
<path d="M720 465 V365" class="edge"/>
<text x="735" y="423" class="label">telemetry / 指标</text>
<path d="M545 532 H385" class="edge"/>
<text x="391" y="511" class="label">SSH sampling →</text>
<path d="M385 568 H545" class="edge"/>
<text x="395" y="597" class="label">← metric stream</text>
<path d="M720 755 V710 H960 V390 H865 V365" class="edge dash"/>
<text x="738" y="733" class="label">validated report / 校验后报告</text>
<path d="M1175 755 V620 H895" class="edge dash"/>
<text x="1154" y="702" class="label">status only / 只读状态</text>
<rect x="65" y="195" width="320" height="170" rx="15" fill="#eef5ff" stroke="#a8c3e8"/>
<text x="83" y="226" class="node">macOS client + widgets</text>
<text x="83" y="253" class="cn">Mac 客户端与组件</text>
<text x="83" y="280" class="detail">Markdown → read-only snapshot</text>
<text x="83" y="307" class="detail">本地文件为事项权威</text>
<text x="83" y="334" class="detail">View preferences stay local</text>
<rect x="545" y="195" width="350" height="170" rx="15" fill="#eef5ff" stroke="#a8c3e8"/>
<text x="563" y="226" class="node">Linux Workbench API</text>
<text x="563" y="253" class="cn">Linux 数据服务</text>
<text x="563" y="280" class="detail">Role tokens / 分角色令牌</text>
<text x="563" y="307" class="detail">Atomic snapshots + state cache</text>
<text x="563" y="334" class="detail">Default: loopback, no collectors</text>
<rect x="1060" y="195" width="310" height="170" rx="15" fill="#eef5ff" stroke="#a8c3e8"/>
<text x="1078" y="226" class="node">Android client + widgets</text>
<text x="1078" y="253" class="cn">安卓客户端与组件</text>
<text x="1078" y="280" class="detail">Read actions / devices / feed</text>
<text x="1078" y="307" class="detail">Upload phone metrics only</text>
<text x="1078" y="334" class="detail">Updates require OS confirmation</text>
<rect x="545" y="465" width="350" height="160" rx="15" fill="#eef5ff" stroke="#a8c3e8"/>
<text x="563" y="496" class="node">Optional metric collectors</text>
<text x="563" y="523" class="cn">可选指标采集</text>
<text x="563" y="550" class="detail">Linux counters + Windows SSH</text>
<text x="563" y="577" class="detail">Missing/stale stays explicit</text>
<text x="563" y="604" class="detail">No general remote-control API</text>
<rect x="65" y="465" width="320" height="160" rx="15" fill="#eef5ff" stroke="#a8c3e8"/>
<text x="83" y="496" class="node">Windows sampling endpoint</text>
<text x="83" y="523" class="cn">Windows 采样端</text>
<text x="83" y="550" class="detail">Existing verified SSH transport</text>
<text x="83" y="577" class="detail">PowerShell counter stream</text>
<text x="83" y="604" class="detail">No new Windows service</text>
<rect x="545" y="755" width="350" height="145" rx="15" fill="#fff8ef" stroke="#d9b985"/>
<text x="563" y="786" class="node">External information pipeline</text>
<text x="563" y="813" class="cn">外部信息整理流程</text>
<text x="563" y="840" class="detail">Collect → review → publish</text>
<text x="563" y="867" class="detail">Local atomic report; not bundled</text>
<rect x="1000" y="755" width="370" height="145" rx="15" fill="#fff8ef" stroke="#d9b985"/>
<text x="1018" y="786" class="node">External gateway / route adapter</text>
<text x="1018" y="813" class="cn">外部网关与路径适配</text>
<text x="1018" y="840" class="detail">Own credentials stay at source</text>
<text x="1018" y="867" class="detail">Read-only status contract</text>
<rect x="65" y="755" width="350" height="145" rx="15" fill="#fff8ef" stroke="#d9b985"/>
<text x="83" y="786" class="node">Local administrators</text>
<text x="83" y="813" class="cn">本地维护者</text>
<text x="83" y="840" class="detail">Publish reviewed APKs / reports</text>
<text x="83" y="867" class="detail">No HTTP upload/admin endpoint</text>
</svg>